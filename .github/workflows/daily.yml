name: events

on:
  schedule:
    # GitHub often starts scheduled runs hours late, so we schedule twice a day at off-peak minutes.
    # Every run is idempotent: collecting is cached, and posting is guarded (see the Post step).
    - cron: "17 2 * * *"      # early morning UTC
    - cron: "43 8 * * *"      # backup for when the first one is delayed or fails
  workflow_dispatch:
    inputs:
      post:
        description: "What to post (weekly, none)"
        default: "none"
      dry_run:
        description: "Dry run (print only)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: events
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_GROUP_ID: ${{ secrets.TELEGRAM_GROUP_ID }}
      TELEGRAM_THREAD_FUN: ${{ secrets.TELEGRAM_THREAD_FUN }}
      TELEGRAM_THREAD_PROFESSIONAL: ${{ secrets.TELEGRAM_THREAD_PROFESSIONAL }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Install a headless browser for JavaScript-only sources
        run: python -m playwright install --with-deps chromium

      - name: Restore state (SQLite lives on the orphan "state" branch)
        run: bash scripts/state_pull.sh

      - name: Collect
        run: python -m sthlm.cli collect

      # Monday: post (or refresh) next week's plan. Any other day: catch up only if the plan was never posted,
      # so a missed or failed Monday run is repaired by the next scheduled run instead of being lost.
      - name: Post the weekly plan
        run: |
          KIND="${{ github.event.inputs.post }}"
          DRY=""
          [ "${{ github.event.inputs.dry_run }}" = "true" ] && DRY="--dry-run"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$(TZ=Europe/Stockholm date +%u)" = "1" ]; then
              python -m sthlm.cli post weekly
            else
              python -m sthlm.cli post weekly --if-missing
            fi
          elif [ "$KIND" = "weekly" ]; then
            python -m sthlm.cli post weekly $DRY
          else
            echo "manual run without posting"
          fi

      - name: Health report
        if: always()
        run: python -m sthlm.cli report --send || true

      - name: Save state
        if: always()
        run: bash scripts/state_push.sh
