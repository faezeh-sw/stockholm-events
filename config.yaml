window_days: 30          # how far ahead we look
timezone: Europe/Stockholm
db_path: data/events.sqlite
site_url: ""             # public web page / calendar feed link shown in posts (set once GitHub Pages is live)

sources:
  luma:
    enabled: true
    # organiser calendars to follow in addition to the ones seen on Luma's Stockholm Discover page
    calendars: [nuttyventures, norrsken, nordictechweek, stockholmdesign, founderslive]
  meetup:
    enabled: true
    groups: [aws-stockholm, producttank-stockholm, pyladiesstockholm, owasp-stockholm, stockholm-ai-safety, avanza-tech-meet-up,
             hiq-tech-meetup, microsoft-reactor-stockholm, spotify, sthlm-tech-meetup, geekgirlmeetup]
    radius_km: 35
    max_pages: 4
  discovery:
    enabled: true       # Claude web search for long-tail company/association events (costs credit)
    min_interval_days: 7
    cache_hours: 144
    workers: 4
    max_uses: 3
  eventbrite:
    enabled: true
    skip_in_ci: true     # Eventbrite blocks GitHub's servers; run it from your own PC if wanted
    detail: true         # fetch each new event page for start time / price
    max_pages: 40
  ticketmaster:
    enabled: true        # needs TICKETMASTER_API_KEY
  tickster:
    enabled: true
    max_urls: 6000
    workers: 16
    time_budget_s: 1500  # a first run may need several runs to fill the cache
  visitstockholm:
    enabled: true
  ics_feeds:                       # iCal feeds: exact, free, no LLM
    feeds:
      - {name: startskott, url: "https://startskott.com/kalender.ics", audience: professional, category: tech, city: Stockholm}
      - {name: startskott_ai, url: "https://startskott.com/kalender/ai-event-stockholm.ics", audience: professional, category: tech, city: Stockholm}
      - {name: aieventlist, url: "https://aieventlist.ai/cities/stockholm/events.ics", audience: professional, category: tech, city: Stockholm}
      - {name: hyperight_ics, url: "https://hyperight.com/events/?ical=1", audience: professional, category: tech, city: Stockholm}
  jsonld_pages:
    pages:
      - {name: devevents_conf, url: "https://dev.events/EU/SE/Stockholm", audience: professional, category: tech, area: Stockholm}
      - {name: devevents_tech, url: "https://dev.events/EU/SE/Stockholm/tech", audience: professional, category: tech, area: Stockholm}
      - {name: devevents_it, url: "https://dev.events/EU/SE/Stockholm/it", audience: professional, category: tech, area: Stockholm}
      - {name: databricks_stockholm_user_gr, url: "https://usergroups.databricks.com/events/details/databricks-user-groups-stockholm-databricks-user-group-presents-building-trustworthy-ai-applications-with-genie/", audience: professional, city: Stockholm}
      - {name: techarena_2027, url: "https://techarena.se/", audience: professional}
      - {name: nordic_data_science_ml_summi, url: "https://hyperight.com/event/nordic-data-science-and-machine-learning-summit-2026-stockholm/", audience: professional, city: Stockholm}
      - {name: data_ai_stockholm_summit, url: "https://dataaistockholm.com/summit", audience: professional}
      - {name: hackerx, url: "https://hackerx.org/events/", audience: professional, category: business, city: Stockholm}
      - {name: stockholmlive, url: "https://stockholmlive.com/en/events/", naive_time: true, area: Stockholm,
         venue_by_domain: {aviciiarena.se: "Avicii Arena", sodrateatern.com: "Södra Teatern", annexet.se: "Annexet",
                           hovetarena.se: "Hovet", strawberryarena.se: "Strawberry Arena", 3arena.se: "3Arena"}}
  sitemap_jsonld:
    sites:
      - {name: sodrateatern, sitemap: "https://sodrateatern.com/robots.txt", include: "/evenemang/", venue: "Södra Teatern", area: Stockholm, cache_hours: 24}
  # LLM-read venue calendars (need ANTHROPIC_API_KEY). Pages that only render with JavaScript
  # (Kulturhuset, Fotografiska, Nobel, libraries) need a headless browser: see backlog in README.
  llm_pages:
    enabled: true
    min_interval_days: 3  # pages without schema.org markup are read by the LLM; unchanged pages are free (cached)
    pages:
      - {name: konserthuset, url: "https://www.konserthuset.se/program-och-biljetter/kalender/", venue: "Konserthuset", category: music}
      - {name: dramaten, url: "https://www.dramaten.se/repertoar/", venue: "Dramaten", category: theatre}
      - {name: debaser, url: "https://debaser.se/", venue: "Debaser", category: music}
      - {name: skansen, url: "https://www.skansen.se/en/calendar/", venue: "Skansen", area: Djurgården}
      - {name: bonniers, url: "https://bonnierskonsthall.se/en/", venue: "Bonniers Konsthall", category: art}
